<svg width="760" height="220" viewBox="0 0 760 220" xmlns="http://www.w3.org/2000/svg">
  <style>
    .term-bg { fill: #0d1117; }
    .term-border { fill: none; stroke: #30363d; stroke-width: 1; }
    .line { font-family: 'JetBrains Mono', monospace; font-size: 16px; opacity: 0; animation: fadeIn 0.5s ease forwards; }
    .prompt { fill: #FF9800; }
    .text { fill: #c9d1d9; }
    .l1 { animation-delay: 0.3s; }
    .l2 { animation-delay: 1.1s; }
    .l3 { animation-delay: 2.1s; }
    .l4 { animation-delay: 2.9s; }
    @keyframes fadeIn { to { opacity: 1; } }
    .cursor { fill: #FF9800; animation: blink 1s step-end infinite; animation-delay: 4s; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <rect class="term-bg" x="0" y="0" width="760" height="220" rx="10"/>
  <rect class="term-border" x="0.5" y="0.5" width="759" height="219" rx="10"/>

  <circle cx="24" cy="24" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="24" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="24" r="6" fill="#27c93f"/>

  <text x="24" y="70" class="line l1"><tspan class="prompt">$ </tspan><tspan class="text">whoami</tspan></text>
  <text x="24" y="100" class="line l2"><tspan class="text">jugaad-chhabra — backend &amp; ai engineer</tspan></text>
  <text x="24" y="140" class="line l3"><tspan class="prompt">$ </tspan><tspan class="text">cat impact.log</tspan></text>
  <text x="24" y="170" class="line l4"><tspan class="text">28% view growth · 30K DAU live backend · agentic pipelines in prod</tspan></text>

  <rect class="cursor" x="24" y="182" width="10" height="16"/>
</svg>
